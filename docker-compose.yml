# Runs the app and a PostgreSQL database together:
#   docker compose up --build      then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crease
      POSTGRES_PASSWORD: crease
      POSTGRES_DB: crease
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crease"]
      interval: 2s
      retries: 20
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://crease:crease@db:5432/crease
    depends_on:
      db:
        condition: service_healthy
